saran:
  Rendah: "Potensi banjir rendah. Pantau kondisi cuaca secara berkala."
  Sedang: "Waspada potensi banjir. Siapkan langkah antisipasi dan pantau terus."
  Tinggi: "BAHAYA BANJIR! Segera evakuasi ke tempat aman."
