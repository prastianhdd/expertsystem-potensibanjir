# ==================================================
# SISTEM PAKAR PERINGATAN BANJIR - Knowledge Base
# Metode: Mamdani Fuzzy Inference System
# Referensi: Tuah, Lestari, Parhusip (2025)
# ==================================================

sistem: "Sistem Pakar Peringatan Banjir"
metode: "Mamdani Fuzzy Inference System"
threshold_alert: 75  # %

variabel_input:
  jarak_air:
    label: "Jarak Sensor ke Muka Air (cm)"
    domain: [0, 210]
    keterangan: "Makin kecil nilainya, makin tinggi air (makin bahaya)"
    himpunan:
      Banjir:
        tipe: segitiga
        params: [0, 0, 145]
      Siaga II:
        tipe: trapesium
        params: [120, 145, 160, 175]
      Siaga I:
        tipe: trapesium
        params: [150, 170, 185, 200]
      Normal:
        tipe: trapesium
        params: [180, 200, 210, 210]

  kenaikan_air:
    label: "Kenaikan Air (cm/menit)"
    domain: [-6, 6]
    keterangan: "Negatif = air turun, Positif = air naik"
    himpunan:
      Turun:
        tipe: segitiga
        params: [-6, -6, 0]
      Stabil:
        tipe: segitiga
        params: [-5, 0, 5]
      Naik:
        tipe: segitiga
        params: [0, 6, 6]

  curah_hujan:
    label: "Curah Hujan (mm)"
    domain: [0, 150]
    keterangan: "0 = tidak hujan, >60 = sangat lebat"
    himpunan:
      Lebat:
        tipe: trapesium
        params: [20, 40, 60, 80]
      Sangat Lebat:
        tipe: trapesium
        params: [60, 80, 150, 150]

variabel_output:
  risiko_banjir:
    label: "Risiko Banjir (%)"
    domain: [0, 100]
    himpunan:
      Very Low:
        tipe: segitiga
        params: [0, 0, 20]
      Low:
        tipe: segitiga
        params: [8, 25, 42]
      Moderate:
        tipe: segitiga
        params: [30, 50, 70]
      High:
        tipe: segitiga
        params: [55, 70, 85]
      Very High:
        tipe: segitiga
        params: [72, 100, 100]

rules:
  # ============================================
  # KELOMPOK BANJIR (air sudah di atas batas)
  # ============================================
  - id: R01
    if: {jarak_air: Banjir, kenaikan_air: Naik, curah_hujan: Sangat Lebat}
    then: Very High
  - id: R02
    if: {jarak_air: Banjir, kenaikan_air: Naik, curah_hujan: Lebat}
    then: Very High
  - id: R03
    if: {jarak_air: Banjir, kenaikan_air: Naik}
    then: Very High
  - id: R04
    if: {jarak_air: Banjir, kenaikan_air: Stabil, curah_hujan: Sangat Lebat}
    then: Very High
  - id: R05
    if: {jarak_air: Banjir, kenaikan_air: Stabil}
    then: Very High
  - id: R06
    if: {jarak_air: Banjir, kenaikan_air: Turun, curah_hujan: Lebat}
    then: Very High
  - id: R07
    if: {jarak_air: Banjir, kenaikan_air: Turun}
    then: High

  # ============================================
  # KELOMPOK SIAGA II
  # ============================================
  - id: R08
    if: {jarak_air: Siaga II, kenaikan_air: Naik, curah_hujan: Sangat Lebat}
    then: Very High
  - id: R09
    if: {jarak_air: Siaga II, kenaikan_air: Naik, curah_hujan: Lebat}
    then: Very High
  - id: R10
    if: {jarak_air: Siaga II, kenaikan_air: Naik}
    then: High
  - id: R11
    if: {jarak_air: Siaga II, kenaikan_air: Stabil, curah_hujan: Lebat}
    then: High
  - id: R12
    if: {jarak_air: Siaga II, kenaikan_air: Stabil}
    then: High
  - id: R13
    if: {jarak_air: Siaga II, kenaikan_air: Turun, curah_hujan: Lebat}
    then: High
  - id: R14
    if: {jarak_air: Siaga II, kenaikan_air: Turun}
    then: Moderate

  # ============================================
  # KELOMPOK SIAGA I
  # ============================================
  - id: R15
    if: {jarak_air: Siaga I, kenaikan_air: Naik, curah_hujan: Sangat Lebat}
    then: Very High
  - id: R16
    if: {jarak_air: Siaga I, kenaikan_air: Naik, curah_hujan: Lebat}
    then: High
  - id: R17
    if: {jarak_air: Siaga I, kenaikan_air: Naik}
    then: Moderate
  - id: R18
    if: {jarak_air: Siaga I, kenaikan_air: Stabil, curah_hujan: Lebat}
    then: Moderate
  - id: R19
    if: {jarak_air: Siaga I, kenaikan_air: Stabil}
    then: Low
  - id: R20
    if: {jarak_air: Siaga I, kenaikan_air: Turun, curah_hujan: Sangat Lebat}
    then: Moderate
  - id: R21
    if: {jarak_air: Siaga I, kenaikan_air: Turun, curah_hujan: Lebat}
    then: Low
  - id: R22
    if: {jarak_air: Siaga I, kenaikan_air: Turun}
    then: Low

  # ============================================
  # KELOMPOK NORMAL
  # ============================================
  - id: R23
    if: {jarak_air: Normal, kenaikan_air: Naik, curah_hujan: Sangat Lebat}
    then: High
  - id: R24
    if: {jarak_air: Normal, kenaikan_air: Naik, curah_hujan: Lebat}
    then: Moderate
  - id: R25
    if: {jarak_air: Normal, kenaikan_air: Naik}
    then: Low
  - id: R26
    if: {jarak_air: Normal, kenaikan_air: Stabil, curah_hujan: Sangat Lebat}
    then: Low
  - id: R27
    if: {jarak_air: Normal, kenaikan_air: Stabil, curah_hujan: Lebat}
    then: Low
  - id: R28
    if: {jarak_air: Normal, kenaikan_air: Stabil}
    then: Very Low
  - id: R29
    if: {jarak_air: Normal, kenaikan_air: Turun}
    then: Very Low

saran:
  Very Low: "Tidak ada potensi banjir. Kondisi aman."
  Low: "Potensi banjir rendah. Pantau kondisi cuaca secara berkala."
  Moderate: "Waspada potensi banjir. Siapkan langkah antisipasi dan pantau terus."
  High: "Siaga banjir! Pantau terus ketinggian air dan siapkan rencana evakuasi."
  Very High: "BAHAYA BANJIR! Segera evakuasi ke tempat aman."
