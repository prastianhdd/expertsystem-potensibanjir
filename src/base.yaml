sistem: "Sistem Pakar Peringatan Banjir"
metode: "Mamdani Fuzzy Inference System"
threshold_alert: 75 

variabel_input:
  jarak_air:
    label: "Jarak Sensor ke Muka Air (cm)"
    domain: [0, 210]
    keterangan: "Makin kecil nilainya, makin tinggi air (makin bahaya)"
    himpunan:
      Bahaya:
        tipe: trapesium
        params: [0, 0, 100, 160]
      Waspada:
        tipe: trapesium
        params: [110, 150, 170, 200]
      Aman:
        tipe: trapesium
        params: [180, 200, 210, 210]

  kenaikan_air:
    label: "Kenaikan Air (cm/menit)"
    domain: [-6, 6]
    keterangan: "Negatif = air turun, Positif = air naik"
    himpunan:
      Turun:
        tipe: segitiga
        params: [-6, -6, 0]
      Stabil:
        tipe: segitiga
        params: [-5, 0, 5]
      Naik:
        tipe: segitiga
        params: [0, 6, 6]

  curah_hujan:
    label: "Curah Hujan (mm)"
    domain: [0, 150]
    keterangan: "Ringan = hujan kecil, Lebat = deras, Sangat Lebat = sangat deras"
    himpunan:
      Ringan:
        tipe: trapesium
        params: [0, 0, 40, 60]
      Lebat:
        tipe: trapesium
        params: [40, 60, 90, 110]
      Sangat Lebat:
        tipe: trapesium
        params: [90, 110, 150, 150]

variabel_output:
  risiko_banjir:
    label: "Risiko Banjir (%)"
    domain: [0, 100]
    himpunan:
      Rendah:
        tipe: segitiga
        params: [0, 0, 50]
      Sedang:
        tipe: segitiga
        params: [25, 50, 75]
      Tinggi:
        tipe: segitiga
        params: [50, 100, 100]

rules:
  - id: R01
    if: {jarak_air: Bahaya, kenaikan_air: Naik, curah_hujan: Sangat Lebat}
    then: Tinggi
  - id: R02
    if: {jarak_air: Bahaya, kenaikan_air: Naik, curah_hujan: Lebat}
    then: Tinggi
